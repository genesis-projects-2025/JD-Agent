on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}

          script: |
            set -e

            echo "Starting JD-Agent Backend deployment sucessful"

            cd /var/www/jd_agent/backend

            echo "Pulling latest code..."
            git pull origin master

            echo "Installing dependencies..."
            /var/www/jd_agent/backend/venv/bin/python -m pip install -r requirements.txt

            echo "Restarting JD-Agent backend..."
            sudo -n /usr/bin/systemctl restart jd_agent

            echo "Checking service status..."
            sudo -n /usr/bin/systemctl status jd_agent --no-pager

            echo "Deployment completed successfully"
